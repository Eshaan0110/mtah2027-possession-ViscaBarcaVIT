[project]
name = "possession"
version = "0.1.0"
description = "More than a Hack 2027, Phase 1: ball possession (H/A/D) from tracking"
requires-python = ">=3.10"
dependencies = ["numpy==2.4.2", "pandas==2.3.3", "scipy==1.18.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
